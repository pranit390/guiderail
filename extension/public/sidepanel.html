<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuideRail</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <strong>Guide<span>Rail</span></strong>
    <button id="teach" type="button" aria-pressed="false" title="Show GuideRail how your team does a task">Teach</button>
    <span id="status" role="status" data-state="idle"></span>
  </header>
  <section id="current-step" aria-label="Current Journey Step" hidden></section>
  <main id="log" aria-live="polite">
    <section id="journey" class="card"></section>
    <p class="msg system">Open a Google page, press Talk (or type), and say what you want to do.</p>
  </main>
  <section id="guidance" class="card" hidden></section>
  <section id="issues" class="card" hidden aria-label="Policy issues">
    <h2 id="issues-summary" role="status" aria-live="polite"></h2>
    <ul id="issues-list"></ul>
  </section>
  <section id="teachbar" class="card" hidden>
    <p><span class="rec state-glyph check" aria-hidden="true"><span>!</span></span> Recording: <span id="teachcount">0</span> steps. Do the task and explain why as you go.</p>
    <button id="teachstop" type="button">Stop and draft Playbook</button>
  </section>
  <section id="draft" class="card" hidden>
    <h2>Playbook draft</h2>
    <pre id="draftmd"></pre>
    <div id="draftrules"></div>
    <button id="publish" type="button">Publish</button>
  </section>
  <div class="page-look" role="group" aria-label="Page appearance">
    <span>Page appearance</span>
    <button id="calmer" type="button">Calmer</button>
    <button id="restore" type="button">Restore</button>
  </div>
  <p id="voice-status" class="voice-status" role="status" aria-live="polite"></p>
  <form id="form">
    <label for="text">Ask GuideRail</label>
    <button id="talk" type="button" aria-pressed="false">Talk</button>
    <input id="text" type="text" placeholder="Ask or type a goal" autocomplete="off">
    <button type="submit">Send</button>
    <button id="voice" type="button" aria-pressed="true" title="Spoken replies on (Alt+Shift+V)">Voice on</button>
  </form>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
