<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="guiderail-url" content="console.cloud.google.com/run/create">
  <title>Create service · GuideRail sandbox</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Roboto, Arial, sans-serif; color: #202124; background: #f8fafd; } * { box-sizing: border-box; } body { margin: 0; }
    .banner { background: #fff7e0; border-bottom: 1px solid #f9ab00; color: #6d4c00; padding: 10px max(24px, calc((100% - 1120px) / 2)); font-size: 14px; font-weight: 600; } header { background: #fff; border-bottom: 1px solid #dadce0; padding: 20px 24px; } header div, main { max-width: 1120px; margin: auto; } .crumb { font-size: 14px; color: #5f6368; } h1 { font-size: 28px; margin: 10px 0 0; font-weight: 500; }
    main { padding: 28px 24px 60px; max-width: 820px; } .card { background: #fff; border: 1px solid #dadce0; border-radius: 12px; padding: clamp(20px, 4vw, 32px); box-shadow: 0 1px 2px #3c40431a; } h2 { font-size: 21px; font-weight: 500; margin: 0 0 24px; } h3 { font-size: 17px; margin: 6px 0 18px; }
    .field { margin: 0 0 23px; } label, legend { display: block; color: #3c4043; font-size: 14px; font-weight: 600; margin-bottom: 8px; } input[type="text"], select { width: 100%; min-height: 44px; border: 1px solid #747775; border-radius: 4px; padding: 10px 12px; background: #fff; font: inherit; color: inherit; } input:focus, select:focus, button:focus-visible { outline: 3px solid #a8c7fa; outline-offset: 1px; border-color: #1967d2; }
    .select-line { display: flex; gap: 10px; } .select-line input { flex: 1; } fieldset { border: 0; margin: 0 0 23px; padding: 0; } .radio { display: flex; align-items: center; gap: 9px; margin: 10px 0; font-weight: 400; } .radio input { accent-color: #1a73e8; width: 18px; height: 18px; }
    button { border: 0; border-radius: 4px; min-height: 38px; padding: 0 18px; cursor: pointer; font: 600 14px/1 inherit; } .primary { color: #fff; background: #1a73e8; } .primary:hover { background: #185abc; } .secondary { color: #1967d2; background: #fff; border: 1px solid #dadce0; } .secondary:hover { background: #f8fafd; } .expand { display: flex; width: 100%; justify-content: space-between; align-items: center; color: #202124; background: #f8fafd; border: 1px solid #dadce0; text-align: left; font-size: 15px; } .expand h3 { margin: 0; font-size: 15px; font-weight: 600; } .expand::after { content: "⌄"; font-size: 19px; } .expand[aria-expanded="true"]::after { content: "⌃"; }
    #advanced { margin-top: 12px; padding: 22px; background: #f8fafd; border: 1px solid #dadce0; border-radius: 8px; } .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #dadce0; margin: 0 0 16px; } .tab { color: #3c4043; background: transparent; border-radius: 0; border-bottom: 2px solid transparent; min-height: 40px; padding: 0 12px; } .tab[aria-selected="true"] { color: #1967d2; border-bottom-color: #1967d2; } .placeholder { margin: 0; color: #5f6368; font-size: 14px; font-weight: 400; } .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .notice { margin-top: 22px; border-radius: 8px; padding: 15px 17px; line-height: 1.45; } .success { color: #0d652d; background: #e6f4ea; border: 1px solid #a8dab5; } .error { color: #8a1c17; background: #fce8e6; border: 1px solid #f6aea9; } .error button { margin-top: 12px; color: #8a1c17; background: #fff; border: 1px solid #f6aea9; } @media (max-width: 520px) { .select-line { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="banner">GuideRail sandbox — practice copy, not Google Cloud</div>
  <header><div><div class="crumb">Cloud Run / Services</div><h1>Create service</h1></div></header>
  <main><form id="service-form"><div class="card">
    <h2>Service settings</h2>
    <div class="field"><label for="service-name">Service name</label><input id="service-name" name="service-name" type="text" autocomplete="off" placeholder="my-service"></div>
    <div class="field"><label for="region">Region</label><select id="region" name="region"><option value="us-central1">us-central1</option><option value="europe-west1">europe-west1</option><option value="asia-south1">asia-south1</option></select></div>
    <div class="field"><label for="image-url">Container image URL</label><div class="select-line"><input id="image-url" name="image-url" type="text" autocomplete="off" placeholder="registry.example/app:latest"><button class="secondary" type="button" id="select-image">Select</button></div></div>
    <fieldset><legend>Authentication</legend><label class="radio"><input type="radio" name="authentication" value="allow" checked> Allow unauthenticated</label><label class="radio"><input type="radio" name="authentication" value="require"> Require authentication</label></fieldset>
    <button class="expand" type="button" id="advanced-toggle" aria-expanded="false" aria-controls="advanced"><h3>Containers, networking, security</h3></button>
    <div id="advanced" hidden>
      <div class="tabs" role="tablist" aria-label="Containers, networking, security">
        <button class="tab" type="button" role="tab" id="tab-containers" aria-selected="true" aria-controls="panel-containers">Containers</button>
        <button class="tab" type="button" role="tab" id="tab-networking" aria-selected="false" aria-controls="panel-networking">Networking</button>
        <button class="tab" type="button" role="tab" id="tab-security" aria-selected="false" aria-controls="panel-security">Security</button>
        <button class="tab" type="button" role="tab" id="tab-settings" aria-selected="false" aria-controls="panel-settings">Settings</button>
        <button class="tab" type="button" role="tab" id="tab-variables" aria-selected="false" aria-controls="panel-variables">Variables &amp; Secrets</button>
        <button class="tab" type="button" role="tab" id="tab-volumes" aria-selected="false" aria-controls="panel-volumes">Volumes</button>
      </div>
      <div role="tabpanel" id="panel-containers" aria-labelledby="tab-containers"><p class="placeholder">Container settings.</p></div>
      <div role="tabpanel" id="panel-networking" aria-labelledby="tab-networking" hidden><p class="placeholder">Networking settings.</p></div>
      <div role="tabpanel" id="panel-security" aria-labelledby="tab-security" hidden><p class="placeholder">Security settings.</p></div>
      <div role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" hidden><p class="placeholder">Revision settings.</p></div>
      <div role="tabpanel" id="panel-variables" aria-labelledby="tab-variables" hidden><p class="placeholder">Variables and secrets.</p></div>
      <div role="tabpanel" id="panel-volumes" aria-labelledby="tab-volumes" hidden><p class="placeholder">Volume mounts.</p></div>
    </div>
    <div class="actions"><button class="primary" type="submit">Create</button><button class="secondary" type="button" id="cancel">Cancel</button></div>
    <div id="result" aria-live="polite"></div>
  </div></form></main>
  <script>
    const toggle = document.getElementById('advanced-toggle'); const advanced = document.getElementById('advanced'); const result = document.getElementById('result');
    toggle.addEventListener('click', () => { const open = toggle.getAttribute('aria-expanded') === 'true'; toggle.setAttribute('aria-expanded', String(!open)); advanced.hidden = open; });
    document.querySelectorAll('#advanced [role="tab"]').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#advanced [role="tab"]').forEach((item) => {
          const selected = item === tab;
          item.setAttribute('aria-selected', String(selected));
          const panel = document.getElementById(item.getAttribute('aria-controls'));
          if (panel) panel.hidden = !selected;
        });
      });
    });
    document.getElementById('select-image').addEventListener('click', () => { result.className = 'notice success'; result.textContent = 'Select an image by entering its URL in the field.'; });
    document.getElementById('cancel').addEventListener('click', () => { result.className = 'notice'; result.textContent = 'Service creation cancelled.'; });
    document.getElementById('service-form').addEventListener('submit', event => { event.preventDefault(); if (new URLSearchParams(location.search).get('denied') === '1') { result.className = 'notice error'; result.innerHTML = '<div>You don\'t have permission to create services in this project. Required permission: run.services.create</div><button type="button">Request access</button>'; return; } const name = document.getElementById('service-name').value.trim() || 'service'; location.href = 'cloud-run-services.html?created=' + encodeURIComponent(name); });
  </script>
</body>
</html>
