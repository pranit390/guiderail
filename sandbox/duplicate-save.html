<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="guiderail-url" content="console.firebase.google.com/project/_/firestore/databases">
  <title>Duplicate Save · GuideRail practice copy</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Roboto, Arial, sans-serif; color: #202124; background: #f8fafd; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #fff; border-bottom: 1px solid #dadce0; padding: 20px clamp(24px, 8vw, 120px); }
    .crumb { font-size: 14px; color: #5f6368; }
    h1 { margin: 8px 0 0; font-weight: 500; font-size: 28px; }
    main { max-width: 760px; margin: 28px auto; padding: 0 24px 48px; display: flex; flex-direction: column; gap: 16px; }
    section { background: #fff; border: 1px solid #dadce0; border-radius: 12px; padding: 22px 24px; }
    h2 { margin: 0 0 16px; font-size: 18px; font-weight: 500; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #747775; border-radius: 4px; font: inherit; }
    .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
    button { min-height: 36px; padding: 0 16px; border: 0; border-radius: 4px; background: #1a73e8; color: #fff; font: 600 14px/1 inherit; cursor: pointer; }
    .note { margin: 0; color: #5f6368; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="crumb">Practice copy · not the Firebase console</div>
    <h1>Permissions</h1>
  </header>
  <main>
    <p class="note">Two Save buttons, on purpose. GuideRail should ask which one, and it should point at Database ID when that is the only match.</p>
    <section aria-label="Billing">
      <h2>Billing</h2>
      <div class="actions"><button type="button">Save</button></div>
    </section>
    <section aria-label="Security">
      <h2>Security</h2>
      <div class="actions"><button type="button">Save</button></div>
    </section>
    <section aria-label="Database">
      <h2>Database</h2>
      <label for="db">Database ID</label>
      <input id="db" name="database-id" autocomplete="off">
    </section>
  </main>
</body>
</html>
